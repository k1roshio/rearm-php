[workspace]
resolver = "2"
members = [
    "crates/rearm-protocol",
    "crates/rearm-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["k1roshio"]

[workspace.dependencies]
rearm-protocol = { path = "crates/rearm-protocol" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
hyper = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "trace"] }
uuid = { version = "1", features = ["v4"] }
mime = "0.3"
httparse = "1"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
brotli = "7"
flate2 = "1"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
async-trait = "0.1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
multer = "3"
dashmap = "6"
parking_lot = "0.12"
sysinfo = "0.33"
